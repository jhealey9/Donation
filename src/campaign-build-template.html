<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disaster Relief — Donate Now</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* ── Hero ───────────────────────────────────────────────────────────────── */
    /*
     * TO USE A REAL PHOTO:
     *   background-image: url('your-hero-photo.jpg');
     *   background-size: cover;
     *   background-position: left center;   ← keeps subject on the LEFT
     *
     * Photo composition tip: your subject should occupy the LEFT ~50% of the
     * frame so they remain fully visible. The form overlays the right side.
     * Use background-position: 30% center to nudge the subject into frame.
     */
    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: stretch;
      background-color: #1a3a2e;   /* deep forest green fallback */
    }

    /* Gradient overlay — darkens the RIGHT side for form legibility */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to left,
        rgba(10, 40, 28, 0.94)  0%,
        rgba(12, 55, 38, 0.84) 35%,
        rgba(12, 55, 38, 0.42) 55%,
        rgba(12, 55, 38, 0.00) 72%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* ── Photo space — left side ─────────────────────────────────────────── */
    .hero__photo-placeholder {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 55%;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.18);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }

    /* ── Right content column ────────────────────────────────────────────── */
    .hero__content {
      position: relative;
      z-index: 2;
      margin-left: auto;          /* push to right side */
      padding: 72px 64px 72px 48px;
      width: 52%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
    }

    /* ── Headline ─────────────────────────────────────────────────────────── */
    .hero__headline {
      color: #ffffff;
      font-size: 50px;
      font-weight: 800;
      line-height: 1.07;
      letter-spacing: -0.025em;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.30);
    }

    /* ── Override form's standalone-page wrapper ─────────────────────────── */
    .hero__content .df-wrapper {
      min-height: unset;
      padding: 0;
      background: transparent;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .hero__content .df-card {
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 64px rgba(0, 0, 0, 0.36);
    }

    /* ── Responsive ────────────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .hero__content  { width: 65%; padding: 56px 40px; }
      .hero__headline { font-size: 40px; }
    }

    @media (max-width: 640px) {
      .hero::before {
        background: linear-gradient(
          to top,
          rgba(10, 40, 28, 0.96) 0%,
          rgba(10, 40, 28, 0.80) 55%,
          rgba(10, 40, 28, 0.35) 100%
        );
      }
      .hero__content {
        width: 100%;
        max-width: 100%;
        margin-left: 0;
        padding: 40px 20px 48px;
        gap: 24px;
        justify-content: flex-end;
        min-height: 100vh;
      }
      .hero__headline           { font-size: 30px; }
      .hero__content .df-card   { max-width: 100%; }
      .hero__photo-placeholder  { display: none; }
    }
  </style>
  <style>
CSSPLACEHOLDER
  </style>
  <!-- Campaign overrides come AFTER built CSS to win the cascade -->
  <style>
    .hero__content .df-wrapper { min-height: unset !important; padding: 0 !important; background: transparent !important; }
    .hero__content .df-card    { max-width: 440px !important; }
  </style>
</head>
<body>
  <div class="hero">

    <!-- Left: your hero photo goes here (subject faces right, positioned on left) -->
    <div class="hero__photo-placeholder" aria-hidden="true">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      Hero photo here<br>
      <small style="font-size:11px;opacity:.6;text-transform:none;letter-spacing:0">
        Subject positioned on the left half<br>facing toward the form
      </small>
    </div>

    <!-- Right: headline + donation form -->
    <div class="hero__content">
      <h1 class="hero__headline">When disaster strikes,<br>your gift is the<br>first response.</h1>
      <div id="root"></div>
    </div>

  </div>
  <script>
JSPLACEHOLDER
  </script>
</body>
</html>
