<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disaster Relief — Donate Now</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 56px 32px 72px;
    }

    /* ── Page layout — two independent floating cards ────────────────────── */
    .layout {
      display: flex;
      align-items: stretch;      /* both cards grow to match the taller sibling */
      gap: 24px;
      width: 100%;
      max-width: 1120px;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       CONTENT CARD
       Two clearly separated zones stacked vertically:
         1. Image zone  — fills remaining card height, never shows text on top
         2. Text zone   — solid background, always legible over any image
       ═══════════════════════════════════════════════════════════════════════ */
    .content-card {
      flex: 1;
      min-width: 0;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;    /* image on top, text section below */
      background-color: #1a3a2e;
    }

    /* ── Zone 1: Image ───────────────────────────────────────────────────── */
    /*
     * The image zone expands to fill all vertical space left after the text
     * section takes its natural height. The <img> inside uses object-fit:cover
     * so any photo fills the zone without letterboxing.
     *
     * TO USE A REAL PHOTO:
     *   Replace the placeholder <div> inside .content-card__image with:
     *     <img src="your-photo.jpg"
     *          alt="Descriptive alt text"
     *          class="content-card__img" />
     *
     * TO CONTROL FOCAL POINT:
     *   Add  object-position: 30% top;  (or any x% y value) to the <img>.
     *   This keeps the subject in frame without cropping their face.
     *   Examples:
     *     object-position: center top    ← subject centered, head visible
     *     object-position: 20% center   ← subject on the left
     *     object-position: right top    ← subject on the right
     */
    .content-card__image {
      flex: 1;                   /* grows to fill card height above text */
      min-height: 200px;         /* floor so image zone never collapses */
      position: relative;
      overflow: hidden;
      background-color: #162e20;
    }

    /* Absolutely positioned so the image fills its zone without contributing
       any intrinsic height to the layout. The form card drives overall height;
       the image paints into whatever space the flex algorithm allocates. */
    .content-card__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center; /* override per-image with inline style */
    }

    /* Placeholder shown when no <img> is present */
    .content-card__img-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.18);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }

    /* ── Zone 2: Text ────────────────────────────────────────────────────── */
    /*
     * Solid background — completely independent from the image above.
     * Edit the eyebrow, headline, and body directly in the HTML below.
     * No rebuild needed; these are plain HTML strings.
     */
    .content-card__text {
      flex: none;                /* natural height, never stretches */
      background: #1a3a2e;
      padding: 36px 48px 48px;
      color: #fff;
    }

    .content-card__eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4ade80;
      margin-bottom: 14px;
    }

    .content-card__headline {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.025em;
      margin-bottom: 16px;
    }

    .content-card__body {
      font-size: 15px;
      line-height: 1.75;
      color: rgba(255, 255, 255, 0.72);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       FORM CARD
       Right component — the React donation form as a self-contained white
       card. The snake border animation renders naturally here.
       ═══════════════════════════════════════════════════════════════════════ */
    .form-card {
      flex: 0 0 476px;
    }

    /* Strip the form's standalone full-page wrapper */
    .form-card .df-wrapper {
      min-height: unset !important;
      padding: 0 !important;
      background: transparent !important;
      justify-content: flex-start !important;
      align-items: flex-start !important;
    }

    /* Let df-card render as its own fully independent card */
    .form-card .df-card {
      width: 100% !important;
      max-width: 100% !important;
    }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 860px) {
      body { padding: 32px 20px 48px; }
      .layout {
        flex-direction: column;
        gap: 20px;
      }
      /* On mobile the image zone needs a fixed height since flex:1 has no
         parent height to expand into when the layout stacks vertically */
      .content-card__image { flex: none; height: 280px; }
      .content-card__text  { padding: 28px 32px 36px; }
      .content-card__headline { font-size: 28px; }
      .form-card { flex: none; width: 100%; }
    }

    @media (max-width: 480px) {
      body { padding: 20px 12px 40px; }
      .content-card__image { height: 220px; }
      .content-card__text  { padding: 24px 24px 32px; }
      .content-card__headline { font-size: 24px; }
    }
  </style>
  <style>
CSSPLACEHOLDER
  </style>
</head>
<body>
  <div class="layout">

    <!-- ═══════════════════════════════════════════════════════════════════
         CONTENT CARD

         ZONE 1 — IMAGE
         Replace the placeholder div with an <img> tag:
           <img src="your-photo.jpg"
                alt="Alt text"
                class="content-card__img"
                style="object-position: center top" />

         Adjust object-position to keep your subject in frame.

         ZONE 2 — TEXT
         Edit eyebrow / headline / body directly below.
         No rebuild required — these are plain HTML strings.
         ═══════════════════════════════════════════════════════════════════ -->
    <div class="content-card">

      <!-- Zone 1: Image -->
      <div class="content-card__image">
        <img
          src="https://images.pexels.com/photos/6471927/pexels-photo-6471927.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2"
          alt="Flooded residential village showing submerged houses"
          class="content-card__img"
          style="object-position: center 60%"
        />
        <!-- Photo by Pexels · Free to use under the Pexels License -->
      </div>

      <!-- Zone 2: Text -->
      <div class="content-card__text">
        <p class="content-card__eyebrow">Emergency Response Fund</p>
        <h1 class="content-card__headline">When disaster strikes,<br>your gift is the<br>first response.</h1>
        <p class="content-card__body">
          Communities devastated by floods, earthquakes, and wildfires need help now.
          Your donation reaches survivors within hours — providing shelter, clean water,
          and a path forward when it matters most.
        </p>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════
         FORM CARD
         ═══════════════════════════════════════════════════════════════════ -->
    <div class="form-card">
      <div id="root"></div>
    </div>

  </div>
  <script>

  </script>
</body>
</html>
